<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Projection of a vector onto another vector</title>
  <desc id="description">The vectors a equals (1, 5) and b equals (5, minus 3), their projection, and the perpendicular residual component.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49372d"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c86f20"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71813a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a84a3d"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#fbf5ea"/>
  <g stroke="#e6d7c2" stroke-width="1">
    <path d="M60 130V710 M120 130V710 M180 130V710 M240 130V710 M300 130V710 M360 130V710 M420 130V710 M480 130V710 M540 130V710 M600 130V710 M660 130V710 M720 130V710 M780 130V710 M840 130V710 M900 130V710 M960 130V710 M1020 130V710 M1080 130V710"/>
    <path d="M60 170H1080 M60 230H1080 M60 290H1080 M60 350H1080 M60 410H1080 M60 470H1080 M60 530H1080 M60 590H1080 M60 650H1080 M60 710H1080"/>
  </g>

  <text x="60" y="76" fill="#49372d" font-family="Inter, DejaVu Sans, sans-serif" font-size="31" font-weight="700">Vector projection</text>
  <text x="60" y="108" fill="#6d5546" font-family="Inter, DejaVu Sans, sans-serif" font-size="21">Projecting a = (1, 5) onto b = (5, −3)</text>
  <text x="735" y="86" fill="#49372d" font-family="DejaVu Sans, sans-serif" font-size="27" font-style="italic">proj<tspan baseline-shift="sub" font-size="17">b</tspan> a =</text>
  <line x1="899" y1="68" x2="1011" y2="68" stroke="#49372d" stroke-width="1.8"/>
  <text x="910" y="58" fill="#49372d" font-family="DejaVu Sans, sans-serif" font-size="23" font-style="italic">a · b</text>
  <text x="910" y="96" fill="#49372d" font-family="DejaVu Sans, sans-serif" font-size="23" font-style="italic">b · b</text>
  <text x="1026" y="86" fill="#49372d" font-family="DejaVu Sans, sans-serif" font-size="27" font-style="italic">b</text>

  <g stroke="#49372d" stroke-width="2.7" fill="none" marker-end="url(#arrow-slate)">
    <path d="M80 530H1085"/>
    <path d="M360 735V145"/>
  </g>
  <g stroke="#8d7562" stroke-width="1.8">
    <path d="M420 522V538 M480 522V538 M540 522V538 M600 522V538 M660 522V538 M720 522V538"/>
    <path d="M352 470H368 M352 410H368 M352 350H368 M352 290H368 M352 590H368 M352 650H368 M352 710H368"/>
  </g>
  <g fill="#6d5546" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">
    <text x="420" y="562">1</text><text x="480" y="562">2</text><text x="540" y="562">3</text><text x="600" y="562">4</text><text x="660" y="562">5</text><text x="720" y="562">6</text>
  </g>
  <g fill="#6d5546" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" text-anchor="end">
    <text x="342" y="476">1</text><text x="342" y="416">2</text><text x="342" y="356">3</text><text x="342" y="296">4</text><text x="342" y="236">5</text><text x="342" y="596">−1</text><text x="342" y="656">−2</text><text x="342" y="716">−3</text>
  </g>
  <text x="1100" y="555" fill="#49372d" font-family="Inter, DejaVu Sans, sans-serif" font-size="25" font-style="italic">x</text>
  <text x="332" y="150" fill="#49372d" font-family="Inter, DejaVu Sans, sans-serif" font-size="25" font-style="italic">y</text>

  <!-- The vector b and its supporting line. -->
  <path d="M150 656 L780 278" stroke="#a7af78" stroke-width="2.5" stroke-dasharray="9 9" fill="none"/>
  <path d="M360 530 L660 710" stroke="#71813a" stroke-width="5" fill="none" marker-end="url(#arrow-green)"/>
  <circle cx="660" cy="710" r="5.5" fill="#71813a"/>
  <text x="690" y="686" fill="#5d6b2f" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-style="italic">b = (5, −3)</text>

  <!-- Projection, its perpendicular residual, and the original vector. -->
  <path d="M360 530 L272 477" stroke="#a84a3d" stroke-width="5" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M272 477 L420 230" stroke="#a84a3d" stroke-width="3.5" stroke-dasharray="12 10" fill="none"/>
  <path d="M360 530 L420 230" stroke="#c86f20" stroke-width="5" fill="none" marker-end="url(#arrow-orange)"/>
  <circle cx="420" cy="230" r="5.5" fill="#c86f20"/>
  <circle cx="272" cy="477" r="5.5" fill="#a84a3d"/>
  <path d="M289 487 L299 470 L282 460" stroke="#6d5546" stroke-width="2.5" fill="none"/>

  <text x="444" y="250" fill="#a95916" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-style="italic">a = (1, 5)</text>
  <text x="82" y="370" fill="#8d3b32" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-style="italic">a₁ = proj<tspan baseline-shift="sub" font-size="15">b</tspan> a</text>
  <text x="82" y="402" fill="#8d3b32" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-style="italic">= (−25/17, 15/17)</text>
  <text x="470" y="365" fill="#8d3b32" font-family="Inter, DejaVu Sans, sans-serif" font-size="19">orthogonal residual</text>

  <g transform="translate(60 755)" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#6d5546">
    <circle cx="5" cy="-6" r="5" fill="#c86f20"/><text x="18" y="0">a</text>
    <circle cx="72" cy="-6" r="5" fill="#71813a"/><text x="85" y="0">b</text>
    <circle cx="139" cy="-6" r="5" fill="#a84a3d"/><text x="152" y="0">projection of a onto b</text>
  </g>
</svg>
